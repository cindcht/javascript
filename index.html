<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="js/script.js" defer></script>
  <link rel="stylesheet" href="css/styles.css">

  <title>Projet</title>
</head>

<body>

  <main>

    <h1>Choix de manga</h1>

    <section>

      <form onsubmit="afficherCarte(event)">

        <fieldset>

          <legend>Manga</legend>

          <label for="manga">Titre</label>
          <input type="text" name="titre" id="manga">

          <label for="genre">Genre</label>
          <input type="text" name="genre" id="genre">

          <label for="nbventes">Nombre de ventes</label>
          <input type="number" name="nbventes" id="nbventes">

        </fieldset>

        <section class="form-buttons">

          <button type="submit">Ajouter</button>

          <a href="index.html" class="btn-cancel">Annuler</a>

        </section>

      </form>

    </section>

    <section>

      <h1>Afficher</h1>

      <p id="affichermanga"></p>
      <p id="affichergenre"></p>
      <p id="affichernbventes"></p>

    </section>

  </main>

  <footer></footer>

</body>

</html>
